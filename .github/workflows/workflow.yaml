name: CI test unit
on: 
  workflow_dispatch:
  push:


jobs:
    unit-test-job:
      name: unit test job
      runs-on: ubuntu-latest
      steps:
        - name: checkout
          uses: actions/checkout@v7

        - name: setup nodeJs
          uses: actions/setup-node@v7

        - name: setup Java
          uses: actions/setup-java@v6
          with:
            distribution: temurin
            java-version: '25'
        
        - name: run java
          run: java --version

        - name: install dependencies
          run: npm install

        - name: run the built
          run: ./gradlew build

        - name: run node test
          run: npm run test


      